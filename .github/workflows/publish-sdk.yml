name: Publish SDK

on:
  push:
    branches: [master]
    paths:
      - "sdk/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/publish-sdk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Verify SDK
        run: |
          npm run typecheck --workspace shuofang-t50-sdk
          npm run test --workspace shuofang-t50-sdk
          npm run build:lib --workspace shuofang-t50-sdk

      - name: Check published version
        id: package-version
        shell: bash
        run: |
          version="$(node -p "require('./sdk/package.json').version")"
          published="$(npm view "shuofang-t50-sdk@${version}" version --json 2>/dev/null || true)"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          if [ "$published" = "\"${version}\"" ] || [ "$published" = "${version}" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "shuofang-t50-sdk@${version} is already published; skipping."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.package-version.outputs.publish == 'true'
        run: npm publish --workspace shuofang-t50-sdk --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
