name: Deploy browser to GitHub Pages

on:
  push:
    branches: [master]
    paths:
      - "browser/**"
      - "sdk/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build SDK and browser editor
        run: |
          npm run build --workspace shuofang-t50-sdk
          npm run build --workspace @buterz/t50-browser

      - name: Verify browser bundle
        shell: bash
        run: |
          if grep -R -n -E 'amdefine|typeof define' browser/dist; then
            echo "The browser bundle contains the untransformed lzma-purejs AMD wrapper."
            exit 1
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: browser/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4
